name: Podaljšaj Instagram token

on:
  schedule:
    - cron: "0 6 1,15 * *"   # 1. in 15. v mesecu
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow requests
      - name: Podaljšaj token
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: python scripts/post.py refresh
      - name: Shrani nov token v Secrets
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "GH_PAT ni nastavljen - token se ni shranil"; exit 1; fi
          gh secret set IG_TOKEN --repo "$GITHUB_REPOSITORY" < /tmp/new_token.txt
