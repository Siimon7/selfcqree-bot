name: Dnevna objava

on:
  schedule:
    # 2x na dan: 14:07 UTC (15:07 pri nas, 9:07 ZDA vzhod) in 23:07 UTC (0:07 pri nas, 18:07 ZDA vzhod)
    - cron: "7 14 * * *"
    - cron: "7 23 * * *"
    # story z vprašanjem: 18:37 UTC (19:37 pri nas, popoldne v ZDA)
    - cron: "37 18 * * *"
  workflow_dispatch:      # gumb "Run workflow" za ročni zagon
    inputs:
      kind:
        description: "post, reel, carousel ali story"
        default: "post"

permissions:
  contents: write

concurrency:
  group: post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow requests
      - run: which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)

      - name: Pripravi objavo (popoldne slika, zvečer Reel)
        env:
          KIND: ${{ github.event.schedule == '7 23 * * *' && 'reel' || github.event.schedule == '37 18 * * *' && 'story' || inputs.kind || 'post' }}
          SHOP_URL: ${{ vars.SHOP_URL || 'https://payhip.com/selfcqree' }}
        run: python scripts/post.py prepare "$KIND"

      - name: Naloži sliko na GitHub
        run: |
          git config user.name "selfcqree-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A images videos state.json
          git commit -m "pripravljena objava"
          git push
          sleep 20

      - name: Objavi na Instagram
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          BUFFER_TOKEN: ${{ secrets.BUFFER_TOKEN }}
          SHOP_URL: ${{ vars.SHOP_URL || 'https://payhip.com/selfcqree' }}
          PINTEREST_BOARD: ${{ vars.PINTEREST_BOARD }}
        run: python scripts/post.py publish

      - name: Shrani stanje
        if: always()
        run: |
          git add state.json
          [ -f last_error.txt ] && git add last_error.txt
          git commit -m "stanje po objavi" || true
          git push
